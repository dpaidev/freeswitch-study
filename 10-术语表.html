<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>术语表 | FreeSWITCH</title>
  <style>
    body { margin: 0; padding: 32px; font-family: Arial, sans-serif; background: #f7f9fc; color: #111827; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #dfe7f1; border-radius: 12px; padding: 22px; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #dfe7f1; padding: 10px 12px; text-align: left; }
    th { background: #eef3ff; }
    h1 { margin-top: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>术语表</h1>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>术语</th>
            <th>定义</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>session</td><td>一段业务会话或一次通话的上下文对象</td></tr>
          <tr><td>channel</td><td>通道对象，表示一条呼叫或媒体通道</td></tr>
          <tr><td>frame</td><td>媒体帧，通常是音频采样块</td></tr>
          <tr><td>RTP</td><td>实时传输协议，用于音视频实时传输</td></tr>
          <tr><td>jitterbuffer</td><td>抖动缓冲区，用于处理乱序和延迟</td></tr>
          <tr><td>module</td><td>动态加载的功能模块</td></tr>
          <tr><td>ASR</td><td>自动语音识别</td></tr>
          <tr><td>TTS</td><td>文本转语音</td></tr>
          <tr><td>IVR</td><td>交互式语音响应</td></tr>
          <tr><td>codec</td><td>编解码器</td></tr>
          <tr><td>resample</td><td>重采样，用于不同采样率的统一处理</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
